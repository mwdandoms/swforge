name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline:
    name: offline (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run offline tests
        # 只跑不需要 SolidWorks 的用例。实机用例（-m sw）在 CI 上必然失败：
        # 那里没有 SolidWorks，假装通过比不跑更糟，所以明确排除。
        run: python -m pytest tests -q -m "not sw"

  markers:
    name: sw markers are honest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Offline tests must not reach SolidWorks
        # SWFORGE_STRICT_MARKERS=1 打开 conftest 里的运行时守卫：
        # 没标 sw marker 的用例一旦真的调用 get_session() 就失败。
        #
        # 为什么用运行时守卫而不是静态扫描：
        # 静态扫描会误报 —— 有些用例只是用 PartBuilder(...).cylinder(r=0)
        # 测参数校验，在连接之前就抛异常了，是合法的离线用例。
        # 文本匹配分不清「构造对象测校验」和「真的去连」。
        env:
          SWFORGE_STRICT_MARKERS: "1"
        run: python -m pytest tests -q -m "not sw"

  package:
    name: package build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      # windows-latest 默认 shell 是 PowerShell 5.1，
      # 它**不会**为原生命令展开 dist/*.whl 这类通配符 —— 必须显式走 bash。
      - name: Check the wheel imports and exposes the CLI
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl | head -n 1)
          echo "wheel: $WHEEL"
          python -m pip install "$WHEEL"
          python -c "import swforge; print('version', swforge.__version__); print('exports', len(swforge.__all__))"
          # 用 python -m 而不是裸命令名：CI 上 Scripts 目录不保证在 PATH 里
          python -m swforge.cli --help

      - name: Check the sdist carries the docs and demo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, tarfile
          path = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(path).getnames()
          docs = [n for n in names if "/docs/" in n]
          demo = [n for n in names if "/demo/" in n]
          print(f"sdist files: {len(names)}, docs: {len(docs)}, demo: {len(demo)}")
          if not docs or not demo:
              print("sdist 缺少 docs/ 或 demo/ -- 检查 MANIFEST.in", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/