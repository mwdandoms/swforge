name: publish to PyPI

# 触发条件：打一个 v 开头的标签（例如 git tag -a v0.9.1 -m "..." && git push origin v0.9.1）
#
# 用 Trusted Publishing（OIDC），**不需要在仓库里存任何 token**。
# 提前在 PyPI 上配置一次「信任这个仓库的这个 workflow」即可，见文末说明。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # 也允许手动触发，便于演练

jobs:
  build:
    name: build distributions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Sanity check before publishing
        shell: bash
        run: |
          set -euo pipefail
          # 1) 版本号必须和标签一致，否则 PyPI 上会出现对不上的版本
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag version: $TAG"
          python - <<PY
          import glob, os, sys
          import tarfile

          tag = os.environ["TAG"]
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              print(f"期望 1 个 wheel，实际 {len(wheels)} 个", file=sys.stderr)
              sys.exit(1)
          whl = os.path.basename(wheels[0])
          # swforge-0.9.0-py3-none-any.whl
          version = whl.split("-")[1]
          print(f"package version: {version}")
          if version != tag:
              print(f"版本不一致：标签 {tag} vs 包 {version}", file=sys.stderr)
              sys.exit(1)

          # 2) sdist 必须带文档，否则 PyPI 页面和源码分发都不完整
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          if not [n for n in names if "/docs/" in n]:
              print("sdist 缺 docs/", file=sys.stderr)
              sys.exit(1)

          # 3) 所有 classifier 必须真的存在
          # v0.9.1 第一次发布就是栽在这里：写了
          #   "Topic :: Scientific/Engineering :: Computer Aided Design"
          # 这个 classifier 根本不存在，PyPI 返回 400，但错误信息埋在
          # 上传日志的 HTML 里，不逐条对照官方清单是看不出来的。
          import email
          import urllib.request
          import zipfile
          from email import policy

          whl_path = wheels[0]
          with zipfile.ZipFile(whl_path) as z:
              meta_name = [n for n in z.namelist() if n.endswith("METADATA")][0]
              msg = email.message_from_bytes(z.read(meta_name), policy=policy.default)
          used = msg.get_all("Classifier") or []
          print(f"classifiers in wheel: {len(used)}")

          url = "https://pypi.org/pypi?%3Aaction=list_classifiers"
          with urllib.request.urlopen(url, timeout=30) as resp:
              official = {ln.strip() for ln in resp.read().decode().splitlines() if ln.strip()}
          print(f"official classifiers: {len(official)}")

          bad = [c for c in used if c not in official]
          if bad:
              print("以下 classifier 不被 PyPI 接受：", file=sys.stderr)
              for c in bad:
                  print(f"  - {c}", file=sys.stderr)
              print("对照 https://pypi.org/pypi?%3Aaction=list_classifiers", file=sys.stderr)
              sys.exit(1)
          print("all classifiers are valid")
          print("sanity check passed")
          PY
        env:
          TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 先发到 TestPyPI 试水。装错了还能改，正式的不能删。
  testpypi:
    name: publish to TestPyPI (optional)
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    # 这一项是可选的预演发布。
    # 没在 test.pypi.org 上配置 Trusted Publisher 时它一定会失败，
    # 但那不影响正式发布——把它标成 continue-on-error，
    # 否则正式 PyPI 明明成功了，整个 run 却显示"失败"，看着像出了问题。
    continue-on-error: true
    permissions:
      id-token: write        # OIDC，Trusted Publishing 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          # 演练阶段不阻塞正式发布：TestPyPI 挂了也继续
          verbose: true

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

# ============================================================================
# 首次使用前的准备（只需做一次）
#
# ① 注册 PyPI 账号并开启 2FA（强制）
#    https://pypi.org/account/register/
#
# ② 在 PyPI 上添加「待发布项目」的 Trusted Publisher
#    https://pypi.org/manage/account/publishing/
#    填写：
#        PyPI Project Name : swforge
#        Owner             : mwdandoms
#        Repository name   : swforge
#        Workflow name     : publish.yml
#        Environment name  : pypi
#
# ③ 同样为 TestPyPI 加一次（可选但推荐）
#    https://test.pypi.org/manage/account/publishing/
#        Environment name  : testpypi
#
# ④ 在 GitHub 仓库里建两个 Environment（Settings → Environments）
#        pypi      —— 建议加 Required reviewers，发版前人工确认
#        testpypi  —— 不用审核
#
# 之后发版流程：
#    git tag -a v0.9.1 -m "v0.9.1"
#    git push origin v0.9.1
#    然后 CI 自动打包 → 校验版本 → 发 TestPyPI → 发 PyPI
#
# 全程不需要在仓库里存任何 token。
# ============================================================================
