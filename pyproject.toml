[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swforge"
version = "0.9.1"
description = "SolidWorks automation toolkit: early-binding geometry builder, GB material library, assembly mates, exact interference, and GB-standard drawings — with readback verification at every step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MWD" }]
keywords = ["solidworks", "cad", "automation", "mcp", "pywin32", "drawing"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Computer Aided Design",
]
dependencies = [
    "pywin32>=306; platform_system == 'Windows'",
    "Pillow>=10",
]

[project.optional-dependencies]
# MechDog 增强：特征台账 / 工程图标注 / 原生 BOM / 交付自检
mechdog = ["solidworks-assetmate-mechdog>=0.8.41,<0.9"]
# MCP 服务
mcp = ["mcp>=1.2.0,<2"]
# PDF 输出
pdf = ["pypdfium2>=4"]

[project.scripts]
swforge = "swforge.cli:main"
solidworks-swforge = "swforge.server:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
markers = [
    "sw: 需要 SolidWorks 正在运行（CI 用 -m 'not sw' 跳过）",
]
testpaths = ["tests"]
